[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bayertap"
version = "0.2.1"
description = "Passive conformance tap for bayerlink links: capture, decode, judge"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Serge Rabyking" }]
requires-python = ">=3.9"
keywords = ["bayer", "raw", "hdmi", "capture", "v4l2", "fpga", "conformance", "tc358743"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = ["numpy",
    # The test patterns ARE the conformance contract: this tool
    # regenerates the reference frame and compares it to what arrived,
    # so it and the source must agree on what "counting" means, byte
    # for byte. A floor below the version this is developed against
    # would let a resolver pair a judge with a definition it does not
    # share, and the failure reads as a bad link rather than a bad
    # install.
    "bayerlink>=0.5.0",]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/bayerlink/bayertap"
Source = "https://github.com/bayerlink/bayertap"
Issues = "https://github.com/bayerlink/bayertap/issues"

[project.scripts]
bayertap = "bayertap.cli:main"

[tool.setuptools.packages.find]
include = ["bayertap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
